<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WaveScribe overlay</title>
<style>
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-Bold.ttf"); font-weight: 600; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px; box-sizing: border-box;
    font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #eceef3; user-select: none; }
  .pill { display: flex; align-items: center; gap: 11px; max-width: 100%; padding: 9px 16px 9px 12px; border-radius: 999px;
    background: rgba(17, 18, 23, 0.94); border: 1px solid rgba(255,255,255,.1); transition: border-color .2s; }
  .pill:not(.ready) { visibility: hidden; }
  .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(255,255,255,.07); }
  .ic svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .txt { min-width: 0; }
  .t { font: 600 13px "Poppins", "Segoe UI", sans-serif; white-space: nowrap; }
  .s { color: #a1a7b3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
  .bars { display: flex; gap: 3px; align-items: center; height: 20px; margin-left: 2px; }
  .bars i { width: 3px; height: 3px; border-radius: 3px; background: currentColor; transition: height .08s linear; }
  .rec { color: #ff5d6c; } .rec .ic { background: rgba(255,93,108,.16); }
  .busy { color: #f5b544; } .busy .ic { background: rgba(245,181,68,.15); } .busy .ic svg { animation: spin 1s linear infinite; }
  .live { color: #34d399; } .live .ic { background: rgba(52,211,153,.15); }
  .added { color: #34d399; } .added .ic { background: rgba(52,211,153,.2); }
  .pill .t { color: #eceef3; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rec .ic, .live.speaking .ic { animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 50% { box-shadow: 0 0 0 5px rgba(255,255,255,.06); } }
</style>
</head>
<body>
<div class="pill" id="pill">
  <div class="ic" id="ic"></div>
  <div class="txt"><div class="t" id="t"></div><div class="s" id="s"></div></div>
  <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
</div>
<script>
  const ICONS = {
    mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
    spin: '<path d="M21 12a9 9 0 1 1-6.22-8.56"/>',
    wave: '<path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  };
  const pill = document.getElementById("pill");
  let last = "";
  window.OV = {
    set(d) {
      const key = JSON.stringify(d);
      if (key === last) return;
      last = key;
      pill.className = "pill ready " + (d.cls || "");
      document.getElementById("ic").innerHTML = `<svg viewBox="0 0 24 24">${ICONS[d.icon] || ""}</svg>`;
      document.getElementById("t").textContent = d.title || "";
      const s = document.getElementById("s");
      s.textContent = d.sub || "";
      s.style.display = d.sub ? "" : "none";
      document.getElementById("bars").style.display = d.bars ? "" : "none";
    },
    level(lv, speaking) {
      const shapes = [0.55, 0.85, 1, 0.8, 0.6];
      document.querySelectorAll("#bars i").forEach((b, i) => {
        b.style.height = `${3 + Math.round(Math.min(1, lv) * 17 * shapes[i] * (0.75 + Math.random() * 0.5))}px`;
      });
      pill.classList.toggle("speaking", !!speaking);
    },
  };
</script>
</body>
</html>
